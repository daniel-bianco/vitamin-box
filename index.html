<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VitaminBox Offenbach</title>
    <meta name="description" content="VitaminBox Offenbach" />
    <script>
      (function () {
        try {
          var lang = localStorage.getItem("vitaminbox-lang");
          if (lang) document.documentElement.lang = lang;
          var savedTheme = localStorage.getItem("vitaminbox-theme");
          var isDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (savedTheme === "light" || savedTheme === "dark") {
            document.documentElement.dataset.theme = savedTheme;
            return;
          }
          document.documentElement.dataset.theme = isDark ? "dark" : "light";
        } catch (error) {}
      })();
    </script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #020202;
        --bg-soft: #060606;
        --surface: rgba(241, 226, 199, 0.03);
        --surface-strong: rgba(241, 226, 199, 0.06);
        --glass: rgba(2, 2, 2, 0.72);
        --ink: #f1e2c7;
        --ink-soft: rgba(241, 226, 199, 0.72);
        --ink-faint: rgba(241, 226, 199, 0.34);
        --line: rgba(241, 226, 199, 0.12);
        --panel-border: rgba(241, 226, 199, 0.16);
        --panel-border-soft: rgba(241, 226, 199, 0.08);
        --grid-line: rgba(241, 226, 199, 0.02);
        --halo: rgba(241, 226, 199, 0.04);
        --control-bg: rgba(241, 226, 199, 0.03);
        --control-hover: rgba(241, 226, 199, 0.06);
        --control-active: rgba(241, 226, 199, 0.12);
        --shadow: 0 36px 120px rgba(0, 0, 0, 0.7);
        --max: 1100px;
      }

      :root[data-theme="light"] {
        color-scheme: light;
        --bg: #f4efe6;
        --bg-soft: #fbf7f1;
        --surface: rgba(31, 26, 22, 0.04);
        --surface-strong: rgba(31, 26, 22, 0.07);
        --glass: rgba(244, 239, 230, 0.82);
        --ink: #1f1a16;
        --ink-soft: rgba(31, 26, 22, 0.76);
        --ink-faint: rgba(31, 26, 22, 0.46);
        --line: rgba(31, 26, 22, 0.12);
        --panel-border: rgba(31, 26, 22, 0.18);
        --panel-border-soft: rgba(31, 26, 22, 0.08);
        --grid-line: rgba(31, 26, 22, 0.03);
        --halo: rgba(31, 26, 22, 0.05);
        --control-bg: rgba(31, 26, 22, 0.04);
        --control-hover: rgba(31, 26, 22, 0.08);
        --control-active: rgba(31, 26, 22, 0.12);
        --shadow: 0 36px 120px rgba(31, 26, 22, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          radial-gradient(circle at 50% 34%, var(--halo), transparent 20%),
          radial-gradient(circle at 50% 68%, color-mix(in srgb, var(--halo) 60%, transparent), transparent 30%),
          linear-gradient(180deg, var(--bg) 0%, var(--bg-soft) 100%);
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(var(--grid-line) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
        background-size: 100% 64px, 64px 100%;
        opacity: 0.18;
      }

      body::after {
        content: "";
        position: fixed;
        inset: -20vmax;
        pointer-events: none;
        background:
          radial-gradient(circle, color-mix(in srgb, var(--ink) 12%, transparent), transparent 22%),
          radial-gradient(circle, var(--halo), transparent 30%);
        background-size: 30vmax 30vmax, 42vmax 42vmax;
        opacity: 0.12;
        animation: drift 28s linear infinite;
        mix-blend-mode: screen;
      }

      @keyframes drift {
        0% {
          transform: translate3d(0, 0, 0) rotate(0deg);
        }
        100% {
          transform: translate3d(6vmax, -4vmax, 0) rotate(8deg);
        }
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .wrap {
        width: min(var(--max), calc(100% - 24px));
        margin: 0 auto;
      }

      .page {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr auto;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        backdrop-filter: blur(16px);
        background: var(--glass);
        border-bottom: 1px solid var(--panel-border-soft);
      }

      .topbar-inner {
        min-height: 62px;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 12px;
      }

      .brand {
        display: grid;
        justify-items: center;
        grid-column: 2;
        justify-self: center;
        min-width: 0;
        text-align: center;
      }

      .brand-mark {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        flex: none;
        opacity: 0.92;
      }

      .brand-mark svg {
        width: 34px;
        height: 34px;
      }

      .brand-copy {
        display: grid;
        min-width: 0;
      }

      .brand-copy strong {
        font-size: 0.75rem;
        letter-spacing: 0.24em;
        text-indent: 0.24em;
        text-transform: uppercase;
      }

      .brand-copy span {
        margin-top: 2px;
        font-size: 0.76rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--ink-faint);
      }

      .nav {
        display: none;
        gap: 18px;
        color: var(--ink-soft);
        font-size: 0.78rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .nav a {
        position: relative;
        padding: 6px 0;
      }

      .nav a::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 2px;
        height: 1px;
        background: currentColor;
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 220ms ease;
        opacity: 0.7;
      }

      .nav a:hover::after {
        transform: scaleX(1);
      }

      .header-controls {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: nowrap;
      }

      .header-controls--language {
        grid-column: 1;
        justify-self: start;
      }

      .header-controls--theme {
        grid-column: 3;
        justify-self: end;
      }

      .toggle-group {
        display: inline-grid;
        grid-auto-flow: column;
        border: 1px solid var(--panel-border);
        background: var(--control-bg);
        overflow: hidden;
      }

      .toggle-btn {
        min-width: 48px;
        min-height: 34px;
        padding: 0 10px;
        border: 0;
        border-right: 1px solid var(--panel-border);
        background: transparent;
        color: var(--ink-faint);
        font: inherit;
        font-size: 0.68rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        cursor: pointer;
        transition: background 180ms ease, color 180ms ease;
      }

      .toggle-btn:last-child {
        border-right: 0;
      }

      .toggle-btn:hover {
        color: var(--ink);
        background: var(--control-hover);
      }

      .toggle-btn[aria-pressed="true"] {
        background: var(--control-active);
        color: var(--ink);
      }

      .theme-toggle .toggle-btn {
        min-width: 42px;
        display: grid;
        place-items: center;
        padding: 0;
      }

      .theme-icon {
        width: 18px;
        height: 18px;
        display: block;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: square;
        stroke-linejoin: miter;
        shape-rendering: crispEdges;
      }

      .theme-icon * {
        vector-effect: non-scaling-stroke;
      }

      .intro-splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: var(--bg);
        pointer-events: none;
        animation: splashExit 620ms ease forwards;
        animation-delay: 1.35s;
      }

      .intro-logo {
        width: min(64vw, 250px);
        overflow: visible;
        color: var(--ink);
        filter:
          drop-shadow(0 0 16px color-mix(in srgb, var(--ink) 30%, transparent))
          drop-shadow(0 0 42px color-mix(in srgb, var(--ink) 12%, transparent));
        animation: introPulse 1.2s ease-in-out both;
      }

      .intro-stroke {
        fill: none;
        stroke: currentColor;
        stroke-width: 5.4;
        stroke-linecap: round;
        stroke-linejoin: round;
        animation: introFlicker 1.1s ease-out both;
      }

      .intro-text {
        stroke-width: 13;
      }

      .intro-subtext {
        stroke-width: 12;
      }

      .page {
        opacity: 0;
        transform: translateY(12px);
        animation: siteReveal 760ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
        animation-delay: 1.48s;
      }

      @keyframes splashExit {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }

      @keyframes introPulse {
        0%,
        100% {
          transform: scale(1);
        }
        45% {
          transform: scale(1.04);
        }
      }

      @keyframes introFlicker {
        0% {
          opacity: 0;
        }
        14% {
          opacity: 1;
        }
        28% {
          opacity: 0.24;
        }
        44% {
          opacity: 1;
        }
        60% {
          opacity: 0.5;
        }
        100% {
          opacity: 1;
        }
      }

      @keyframes siteReveal {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .hero {
        display: grid;
        align-items: center;
        min-height: calc(100svh - 62px);
        padding: 12px 0 22px;
      }

      .hero-inner {
        display: grid;
        gap: 22px;
        justify-items: center;
        text-align: center;
        transform: translateY(-18px);
      }

      .logo-wrap {
        width: min(100%, 680px);
        display: grid;
        justify-items: center;
        gap: 20px;
      }

      .hero-copy {
        display: grid;
        gap: 24px;
        justify-items: center;
        text-align: center;
        opacity: 0;
        transform: translateY(12px);
        animation: fadeUp 0.95s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        animation-delay: 0.82s;
      }

      .logo {
        width: min(74vw, 360px);
        display: block;
        overflow: visible;
        color: var(--ink);
        filter:
          drop-shadow(0 0 10px color-mix(in srgb, var(--ink) 16%, transparent))
          drop-shadow(0 18px 42px rgba(0, 0, 0, 0.42));
      }

      .stroke {
        fill: none;
        stroke: currentColor;
        stroke-width: 5.4;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0;
        animation: flicker 0.7s ease-out forwards;
      }

      .logo-text {
        stroke-width: 11;
      }

      .logo-subtext {
        stroke-width: 10;
      }

      .stroke.delay-1 {
        animation-delay: 0s;
      }

      .stroke.delay-2 {
        animation-delay: 0.04s;
      }

      .stroke.delay-3 {
        animation-delay: 0.08s;
      }

      .stroke.delay-4 {
        animation-delay: 0.12s;
      }

      .stroke.delay-5 {
        animation-delay: 0.16s;
      }

      .stroke.delay-6 {
        animation-delay: 0.2s;
      }

      .stroke.delay-7 {
        animation-delay: 0.24s;
      }

      .stroke.delay-8 {
        animation-delay: 0.28s;
      }

      .stroke.delay-9 {
        animation-delay: 0.32s;
      }

      .stroke.delay-10 {
        animation-delay: 0.36s;
      }

      @keyframes flicker {
        0% {
          opacity: 0;
        }
        12% {
          opacity: 1;
        }
        24% {
          opacity: 0.2;
        }
        36% {
          opacity: 1;
        }
        52% {
          opacity: 0.5;
        }
        68% {
          opacity: 1;
        }
        100% {
          opacity: 1;
        }
      }

      .logo-copy {
        display: grid;
        gap: 14px;
        justify-items: center;
      }

      .wordmark {
        font-size: clamp(1.85rem, 6vw, 3.65rem);
        line-height: 0.92;
        letter-spacing: 0.32em;
        text-indent: 0.32em;
        text-transform: uppercase;
        font-weight: 300;
        color: var(--ink);
        opacity: 0;
        transform: translateY(10px);
        animation: fadeUp 1.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        animation-delay: 1.02s;
      }

      .submark {
        font-size: clamp(0.78rem, 1.8vw, 0.95rem);
        line-height: 1;
        letter-spacing: 0.34em;
        text-indent: 0.34em;
        text-transform: uppercase;
        color: var(--ink-faint);
        opacity: 0;
        transform: translateY(10px);
        animation: fadeUp 1.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        animation-delay: 1.18s;
      }

      @keyframes fadeUp {
        0% {
          opacity: 0;
          transform: translateY(10px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .lead {
        max-width: 42ch;
        color: var(--ink-soft);
        font-size: 0.94rem;
        line-height: 1.8;
      }

      .cta {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
      }

      .btn {
        min-height: 44px;
        padding: 0 18px;
        border-radius: 0;
        border: 1px solid var(--panel-border);
        background: var(--control-bg);
        color: var(--ink);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-size: 0.74rem;
        transition: transform 220ms ease, border-color 220ms ease, background 220ms ease;
      }

      .btn:hover {
        transform: translateY(-1px);
        border-color: var(--ink-soft);
        background: var(--control-hover);
      }

      .footer {
        padding: 10px 0 18px;
        color: var(--ink-faint);
        font-size: 0.72rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .footer-inner {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding-top: 14px;
        border-top: 1px solid var(--panel-border-soft);
      }

      .bottom-space {
        height: 18px;
      }

      @media (min-width: 900px) {
        .nav {
          display: flex;
        }

        .hero {
          min-height: calc(100svh - 62px);
          padding: 24px 0 30px;
        }

        .hero-inner {
          gap: 30px;
          transform: translateY(-14px);
        }

        .logo {
          width: min(32vw, 390px);
        }

        .wordmark {
          letter-spacing: 0.36em;
          text-indent: 0.36em;
        }

      }

      @media (max-width: 899px) {
        .wrap {
          width: min(var(--max), calc(100% - 18px));
        }

        .topbar-inner {
          min-height: 58px;
        }

        .header-controls {
          width: auto;
        }

        .wordmark {
          letter-spacing: 0.24em;
          text-indent: 0.24em;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }

        body::after,
        .intro-splash,
        .page,
        .stroke,
        .hero-copy,
        .wordmark,
        .submark,
        .lead,
        .cta {
          animation: none;
          opacity: 1;
          transform: none;
        }

        .intro-splash {
          display: none;
        }

        .stroke {
          opacity: 1;
        }

        .logo {
          filter: drop-shadow(0 0 10px rgba(241, 226, 199, 0.16));
        }

        .btn {
          transition: none;
        }
      }
    </style>
  </head>
