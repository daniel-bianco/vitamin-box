<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VitaminBox Offenbach</title>
    <meta name="description" content="VitaminBox Offenbach" />
    <script>
      (function () {
        try {
          var lang = localStorage.getItem("vitaminbox-lang");
          if (lang) document.documentElement.lang = lang;
          var isDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = isDark ? "dark" : "light";
        } catch (error) {}
      })();
    </script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #020202;
        --bg-soft: #060606;
        --surface: rgba(241, 226, 199, 0.03);
        --surface-strong: rgba(241, 226, 199, 0.06);
        --glass: rgba(2, 2, 2, 0.72);
        --ink: #f1e2c7;
        --ink-soft: rgba(241, 226, 199, 0.72);
        --ink-faint: rgba(241, 226, 199, 0.34);
        --line: rgba(241, 226, 199, 0.12);
        --panel-border: rgba(241, 226, 199, 0.16);
        --panel-border-soft: rgba(241, 226, 199, 0.08);
        --grid-line: rgba(241, 226, 199, 0.02);
        --halo: rgba(241, 226, 199, 0.04);
        --control-bg: rgba(241, 226, 199, 0.03);
        --control-hover: rgba(241, 226, 199, 0.06);
        --control-active: rgba(241, 226, 199, 0.12);
        --shadow: 0 36px 120px rgba(0, 0, 0, 0.7);
        --max: 1100px;
      }

      :root[data-theme="light"] {
        color-scheme: light;
        --bg: #f4efe6;
        --bg-soft: #fbf7f1;
        --surface: rgba(31, 26, 22, 0.04);
        --surface-strong: rgba(31, 26, 22, 0.07);
        --glass: rgba(244, 239, 230, 0.82);
        --ink: #1f1a16;
        --ink-soft: rgba(31, 26, 22, 0.76);
        --ink-faint: rgba(31, 26, 22, 0.46);
        --line: rgba(31, 26, 22, 0.12);
        --panel-border: rgba(31, 26, 22, 0.18);
        --panel-border-soft: rgba(31, 26, 22, 0.08);
        --grid-line: rgba(31, 26, 22, 0.03);
        --halo: rgba(31, 26, 22, 0.05);
        --control-bg: rgba(31, 26, 22, 0.04);
        --control-hover: rgba(31, 26, 22, 0.08);
        --control-active: rgba(31, 26, 22, 0.12);
        --shadow: 0 36px 120px rgba(31, 26, 22, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          radial-gradient(circle at 50% 34%, var(--halo), transparent 20%),
          radial-gradient(circle at 50% 68%, color-mix(in srgb, var(--halo) 60%, transparent), transparent 30%),
          linear-gradient(180deg, var(--bg) 0%, var(--bg-soft) 100%);
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(var(--grid-line) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
        background-size: 100% 64px, 64px 100%;
        opacity: 0.18;
      }

      body::after {
        content: "";
        position: fixed;
        inset: -20vmax;
        pointer-events: none;
        background:
          radial-gradient(circle, color-mix(in srgb, var(--ink) 12%, transparent), transparent 22%),
          radial-gradient(circle, var(--halo), transparent 30%);
        background-size: 30vmax 30vmax, 42vmax 42vmax;
        opacity: 0.12;
        animation: drift 28s linear infinite;
        mix-blend-mode: screen;
      }

      @keyframes drift {
        0% {
          transform: translate3d(0, 0, 0) rotate(0deg);
        }
        100% {
          transform: translate3d(6vmax, -4vmax, 0) rotate(8deg);
        }
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .wrap {
        width: min(var(--max), calc(100% - 24px));
        margin: 0 auto;
      }

      .page {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr auto;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        backdrop-filter: blur(16px);
        background: var(--glass);
        border-bottom: 1px solid var(--panel-border-soft);
      }

      .topbar-inner {
        min-height: 62px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        flex-wrap: wrap;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .brand-mark {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        flex: none;
        opacity: 0.92;
      }

      .brand-mark svg {
        width: 34px;
        height: 34px;
      }

      .brand-copy {
        display: grid;
        min-width: 0;
      }

      .brand-copy strong {
        font-size: 0.75rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
      }

      .brand-copy span {
        margin-top: 2px;
        font-size: 0.76rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--ink-faint);
      }

      .nav {
        display: none;
        gap: 18px;
        color: var(--ink-soft);
        font-size: 0.78rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .nav a {
        position: relative;
        padding: 6px 0;
      }

      .nav a::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 2px;
        height: 1px;
        background: currentColor;
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 220ms ease;
        opacity: 0.7;
      }

      .nav a:hover::after {
        transform: scaleX(1);
      }

      .header-controls {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: auto;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .toggle-group {
        display: inline-grid;
        grid-auto-flow: column;
        border: 1px solid var(--panel-border);
        background: var(--control-bg);
        overflow: hidden;
      }

      .toggle-btn {
        min-width: 50px;
        min-height: 34px;
        padding: 0 10px;
        border: 0;
        border-right: 1px solid var(--panel-border);
        background: transparent;
        color: var(--ink-faint);
        font: inherit;
        font-size: 0.68rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        cursor: pointer;
        transition: background 180ms ease, color 180ms ease;
      }

      .toggle-btn:last-child {
        border-right: 0;
      }

      .toggle-btn:hover {
        color: var(--ink);
        background: var(--control-hover);
      }

      .toggle-btn[aria-pressed="true"] {
        background: var(--control-active);
        color: var(--ink);
      }

      .hero {
        display: grid;
        align-items: center;
        min-height: calc(100vh - 62px);
        padding: 28px 0 32px;
      }

      .hero-inner {
        display: grid;
        gap: 34px;
        justify-items: center;
        text-align: center;
      }

      .logo-wrap {
        width: min(100%, 680px);
        display: grid;
        justify-items: center;
        gap: 20px;
      }

      .hero-copy {
        display: grid;
        gap: 34px;
        justify-items: center;
        text-align: center;
        opacity: 0;
        transform: translateY(12px);
        animation: fadeUp 0.95s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        animation-delay: 0.82s;
      }

      .logo {
        width: min(86vw, 420px);
        aspect-ratio: 1 / 1;
        display: block;
        overflow: visible;
        filter:
          drop-shadow(0 0 10px rgba(241, 226, 199, 0.16))
          drop-shadow(0 18px 42px rgba(0, 0, 0, 0.42));
      }

      .stroke {
        fill: none;
        stroke: var(--ink);
        stroke-width: 2.7;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0;
        animation: flicker 0.7s ease-out forwards;
      }

      .stroke.delay-1 {
        animation-delay: 0s;
      }

      .stroke.delay-2 {
        animation-delay: 0.04s;
      }

      .stroke.delay-3 {
        animation-delay: 0.08s;
      }

      .stroke.delay-4 {
        animation-delay: 0.12s;
      }

      .stroke.delay-5 {
        animation-delay: 0.16s;
      }

      .stroke.delay-6 {
        animation-delay: 0.2s;
      }

      .stroke.delay-7 {
        animation-delay: 0.24s;
      }

      .stroke.delay-8 {
        animation-delay: 0.28s;
      }

      .stroke.delay-9 {
        animation-delay: 0.32s;
      }

      .stroke.delay-10 {
        animation-delay: 0.36s;
      }

      @keyframes flicker {
        0% {
          opacity: 0;
        }
        12% {
          opacity: 1;
        }
        24% {
          opacity: 0.2;
        }
        36% {
          opacity: 1;
        }
        52% {
          opacity: 0.5;
        }
        68% {
          opacity: 1;
        }
        100% {
          opacity: 1;
        }
      }

      .logo-copy {
        display: grid;
        gap: 14px;
        justify-items: center;
      }

      .wordmark {
        font-size: clamp(1.85rem, 6vw, 3.65rem);
        line-height: 0.92;
        letter-spacing: 0.32em;
        text-indent: 0.32em;
        text-transform: uppercase;
        font-weight: 300;
        color: var(--ink);
        opacity: 0;
        transform: translateY(10px);
        animation: fadeUp 1.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        animation-delay: 1.02s;
      }

      .submark {
        font-size: clamp(0.78rem, 1.8vw, 0.95rem);
        line-height: 1;
        letter-spacing: 0.34em;
        text-indent: 0.34em;
        text-transform: uppercase;
        color: var(--ink-faint);
        opacity: 0;
        transform: translateY(10px);
        animation: fadeUp 1.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        animation-delay: 1.18s;
      }

      @keyframes fadeUp {
        0% {
          opacity: 0;
          transform: translateY(10px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .lead {
        max-width: 42ch;
        color: var(--ink-soft);
        font-size: 0.94rem;
        line-height: 1.8;
      }

      .cta {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
      }

      .btn {
        min-height: 44px;
        padding: 0 18px;
        border-radius: 0;
        border: 1px solid var(--panel-border);
        background: var(--control-bg);
        color: var(--ink);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-size: 0.74rem;
        transition: transform 220ms ease, border-color 220ms ease, background 220ms ease;
      }

      .btn:hover {
        transform: translateY(-1px);
        border-color: var(--ink-soft);
        background: var(--control-hover);
      }

      .footer {
        padding: 10px 0 18px;
        color: var(--ink-faint);
        font-size: 0.72rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .footer-inner {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding-top: 14px;
        border-top: 1px solid var(--panel-border-soft);
      }

      .bottom-space {
        height: 18px;
      }

      @media (min-width: 900px) {
        .nav {
          display: flex;
        }

        .hero {
          min-height: calc(100vh - 62px);
          padding: 36px 0 38px;
        }

        .hero-inner {
          gap: 42px;
        }

        .logo {
          width: min(44vw, 470px);
        }

        .wordmark {
          letter-spacing: 0.36em;
          text-indent: 0.36em;
        }

      }

      @media (max-width: 899px) {
        .wrap {
          width: min(var(--max), calc(100% - 18px));
        }

        .topbar-inner {
          min-height: 58px;
        }

        .header-controls {
          width: 100%;
          justify-content: space-between;
        }

        .wordmark {
          letter-spacing: 0.24em;
          text-indent: 0.24em;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }

        body::after,
        .stroke,
        .hero-copy,
        .wordmark,
        .submark,
        .lead,
        .cta {
          animation: none;
          opacity: 1;
          transform: none;
        }

        .stroke {
          opacity: 1;
        }

        .logo {
          filter: drop-shadow(0 0 10px rgba(241, 226, 199, 0.16));
        }

        .btn {
          transition: none;
        }
      }
    </style>
  </head>
  <body data-page="home">

        <div class="wrap topbar-inner">
          <div class="brand">
            <div class="brand-mark" aria-hidden="true">

                <path d="M11 18.5L24 10L37 18.5L24 27L11 18.5Z" class="stroke delay-1" />
                <path d="M11 18.5L11 31.5L24 40L24 27L11 18.5Z" class="stroke delay-2" />
                <path d="M37 18.5L37 31.5L24 40L24 27L37 18.5Z" class="stroke delay-3" />
                <path d="M11 31.5L24 24L37 31.5" class="stroke delay-4" />
                <path d="M24 10L24 24" class="stroke delay-5" />
                <path d="M16 14L30 20" class="stroke delay-6" />
                <path d="M18 32L30 39" class="stroke delay-7" />
                <path d="M9 20L13 18" class="stroke delay-8" />

              </svg>
            </div>
            <div class="brand-copy">
              <strong>VitaminBox</strong>

          </div>
          <nav class="nav" aria-label="Navigation">

            <div class="toggle-group" aria-label="Language switcher">
              <button class="toggle-btn" type="button" data-lang-choice="de" aria-pressed="false">DE</button>
              <button class="toggle-btn" type="button" data-lang-choice="en" aria-pressed="true">EN</button>
            </div>
          </div>
        </div>
      </header>

      <main class="hero">
        <div class="wrap hero-inner">
          <div class="logo-wrap">
            <svg class="logo" viewBox="0 0 520 560" fill="none" aria-hidden="true">
              <path
                d="M164 242L257 178L350 244L257 308L164 242Z"

              />
              <path
                d="M164 242L158 367L253 430L257 308L164 242Z"

              <path

              />
              <path d="M164 242L257 278L350 244" class="stroke delay-4" />

              <path d="M257 178L257 308L253 430" class="stroke delay-6" />
              <path d="M167 241L180 214" class="stroke delay-7" />
              <path d="M350 244L366 233" class="stroke delay-8" />

              <path d="M253 430L247 446" class="stroke delay-10" />

          </div>

          <div class="hero-copy">
            <div class="logo-copy">
              <div class="wordmark">Vitamin Box</div>

            <p class="lead">
              Bio supplements, proteins, and more for daily support, balance, and a healthy
              lifestyle.
            </p>

            <div class="cta">
              <a class="btn" href="/about.html">PRODUCTS</a>
              <a class="btn" href="/contact.html">Contact</a>
            </div>
          </div>
        </div>
      </main>

      <footer class="footer">
        <div class="wrap footer-inner">
          <div>VitaminBox Offenbach</div>
          <div data-footer-role="page">main page</div>
        </div>
      </footer>
    </div>
    <script src="./site-controls.js"></script>
  </body>
</html>
